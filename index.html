<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran Reel Creator</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>Quran Reel Creator</h1>

    <div id="modeToggle">
      <button id="modeABtn" class="mode-btn active">Reciter</button>
      <button id="modeBBtn" class="mode-btn">Custom Audio</button>
    </div>

    <div id="quranControls">
      <label for="surahSelect">Surah</label>
      <select id="surahSelect">
        <option>Loading…</option>
      </select>

      <label>Ayah range</label>
      <div class="range-group">
        <input type="number" id="ayahFrom" min="1" placeholder="From" />
        <input type="number" id="ayahTo" min="1" placeholder="To" />
      </div>
    </div>

    <div id="modeAPanel">
      <select id="reciterSelect">
        <option>Loading…</option>
      </select>
      <label for="audioPreview">Audio preview</label>
      <audio id="audioPreview" controls></audio>
    </div>

    <div id="modeBPanel" style="display:none">
      <label for="customAudioInput">Upload audio file</label>
      <input type="file" id="customAudioInput" accept=".mp3,.wav,.ogg,.m4a" />
      <p id="customAudioHint" class="file-hint">No file chosen</p>
    </div>

    <!-- Background video — always visible, drives live preview -->
    <label for="bgVideoInput">Background video</label>
    <input type="file" id="bgVideoInput" accept=".mp4,.mov,.webm" />
    <p id="bgVideoHint" class="file-hint">No video chosen</p>

    <!-- Subtitle style controls — always visible -->
    <div id="subtitleControls">
      <label for="fontSizeSlider">Subtitle font size: <span id="fontSizeValue">28</span>px</label>
      <input type="range" id="fontSizeSlider" min="16" max="72" value="28" step="2" />

      <label>
        <input type="checkbox" id="autoScaleFont" checked /> Auto-scale font to video resolution
      </label>

      <label for="subtitleColor">Subtitle color</label>
      <input type="color" id="subtitleColor" value="#ffffff" />

      <label for="outlineColor">Outline color</label>
      <input type="color" id="outlineColor" value="#000000" />
    </div>

    <button id="renderBtn">Generate ASS</button>
    <div id="status"></div>
    <button id="downloadAssBtn" style="display:none; margin-top:12px;">Download ASS</button>

    <!-- Video render section — shown after generation -->
    <div id="videoUploadSection">
      <div id="subtitlePositionDiv">
        <label for="subtitlePosition">Subtitle position</label>
        <select id="subtitlePosition">
          <option value="2">Bottom center</option>
          <option value="8">Top center</option>
          <option value="5">Middle center</option>
        </select>
      </div>

      <label>
        <input type="checkbox" id="muteVideoCheck" /> Mute original video audio
      </label>
      <button id="renderVideoBtn">Render Video</button>

      <div id="downloadBtns" style="display:none; gap:8px; margin-top:12px">
        <button id="downloadMp4Btn">Download MP4</button>
      </div>
    </div>

  </div>
  <script type="module" src="js/app.js"></script>
</body>

</html>
