<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran Reel Creator</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>Quran Reel Creator</h1>

    <label for="surahSelect">Surah</label>
    <select id="surahSelect">
      <option>Loading…</option>
    </select>

    <label>Ayah range</label>
    <div class="range-group">
      <input type="number" id="ayahFrom" min="1" placeholder="From" />
      <input type="number" id="ayahTo" min="1" placeholder="To" />
    </div>

    <select id="reciterSelect">
      <option>Loading…</option>
    </select>

    <label for="audioPreview">Audio preview</label>
    <audio id="audioPreview" controls></audio>

    <label for="bgUpload">Background video</label>
    <input type="file" id="bgUpload" accept=".mp4,.mov,.webm" />

    <button id="renderBtn">Generate SRT</button>
    <button id="downloadBtn" style="display:none">Download SRT</button>
    <div id="status"></div>
  </div>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/preview.js"></script>
</body>

</html>
